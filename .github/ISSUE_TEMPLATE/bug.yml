name: Bug report
description: Report a reproducible defect in dsh-autofix.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private session logs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: dsh-autofix version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: DSH, Node.js, package manager and OS versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and redacted evidence
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I used synthetic or non-sensitive data.
          required: true
        - label: I searched existing issues and removed secrets.
          required: true
